<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1180" height="760" fill="#ffffff"/>

  <text x="30" y="36" font-size="22" font-weight="700" fill="#1a1a2e">Investment Desk — Fortified Enterprise Fleet architecture</text>

  <!-- User -->
  <rect x="30" y="70" width="180" height="60" rx="10" fill="#eef2ff" stroke="#3b4cca" stroke-width="1.5"/>
  <text x="120" y="105" font-size="14" text-anchor="middle" fill="#1a1a2e">User (chat / voice)</text>

  <!-- Data stores -->
  <rect x="960" y="60" width="190" height="50" rx="8" fill="#fff7e6" stroke="#c98a1a" stroke-width="1.2"/>
  <text x="1055" y="90" font-size="12.5" text-anchor="middle" fill="#4d3400">strategy_library (data store)</text>
  <rect x="960" y="120" width="190" height="50" rx="8" fill="#fff7e6" stroke="#c98a1a" stroke-width="1.2"/>
  <text x="1055" y="150" font-size="12.5" text-anchor="middle" fill="#4d3400">risk_policy (data store)</text>

  <!-- Orchestrator -->
  <rect x="420" y="70" width="260" height="60" rx="10" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.8"/>
  <text x="550" y="98" font-size="14" font-weight="700" text-anchor="middle" fill="#0b3d19">Orchestrator Agent</text>
  <text x="550" y="116" font-size="11.5" text-anchor="middle" fill="#0b3d19">agent registry / routing — Gemini Enterprise</text>

  <line x1="210" y1="100" x2="418" y2="100" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="680" y1="90" x2="958" y2="85" stroke="#c98a1a" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-amber)"/>
  <line x1="680" y1="110" x2="958" y2="145" stroke="#c98a1a" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-amber)"/>

  <!-- Specialist agents row -->
  <g font-size="12.5">
    <rect x="30" y="200" width="200" height="70" rx="10" fill="#eef2ff" stroke="#3b4cca" stroke-width="1.4"/>
    <text x="130" y="228" text-anchor="middle" font-weight="700" fill="#1a1a2e">Strategy Builder</text>
    <text x="130" y="245" text-anchor="middle" fill="#1a1a2e">NL -&gt; structured</text>
    <text x="130" y="260" text-anchor="middle" fill="#1a1a2e">strategy definition</text>

    <rect x="260" y="200" width="200" height="70" rx="10" fill="#eef2ff" stroke="#3b4cca" stroke-width="1.4"/>
    <text x="360" y="228" text-anchor="middle" font-weight="700" fill="#1a1a2e">Technical Analyst</text>
    <text x="360" y="245" text-anchor="middle" fill="#1a1a2e">Trading Desk —</text>
    <text x="360" y="260" text-anchor="middle" fill="#1a1a2e">SMC / divergence / CCI+EMA</text>

    <rect x="490" y="200" width="200" height="70" rx="10" fill="#eef2ff" stroke="#3b4cca" stroke-width="1.4"/>
    <text x="590" y="228" text-anchor="middle" font-weight="700" fill="#1a1a2e">Investment Analyst</text>
    <text x="590" y="245" text-anchor="middle" fill="#1a1a2e">Investment Desk —</text>
    <text x="590" y="260" text-anchor="middle" fill="#1a1a2e">quality/value screen</text>

    <rect x="720" y="200" width="210" height="70" rx="10" fill="#fdeaea" stroke="#c62828" stroke-width="1.6"/>
    <text x="825" y="228" text-anchor="middle" font-weight="700" fill="#5c0f0f">Risk &amp; Execution</text>
    <text x="825" y="245" text-anchor="middle" fill="#5c0f0f">position sizing, daily</text>
    <text x="825" y="260" text-anchor="middle" fill="#5c0f0f">cap gate, order placement</text>

    <rect x="960" y="200" width="190" height="70" rx="10" fill="#eef2ff" stroke="#3b4cca" stroke-width="1.4"/>
    <text x="1055" y="228" text-anchor="middle" font-weight="700" fill="#1a1a2e">Reporting</text>
    <text x="1055" y="245" text-anchor="middle" fill="#1a1a2e">personalized</text>
    <text x="1055" y="260" text-anchor="middle" fill="#1a1a2e">8am daily feed</text>
  </g>

  <!-- Orchestrator -> specialists -->
  <line x1="480" y1="130" x2="130" y2="198" stroke="#666" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="520" y1="130" x2="360" y2="198" stroke="#666" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="580" y1="130" x2="590" y2="198" stroke="#666" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="640" y1="130" x2="825" y2="198" stroke="#666" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="670" y1="130" x2="1055" y2="198" stroke="#666" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Backend -->
  <rect x="280" y="340" width="620" height="90" rx="12" fill="#f3e8fd" stroke="#7b2cbf" stroke-width="1.8"/>
  <text x="590" y="368" font-size="15" font-weight="700" text-anchor="middle" fill="#3a0a5b">FastAPI backend (tools/actions)</text>
  <text x="590" y="388" font-size="12" text-anchor="middle" fill="#3a0a5b">/analyze-technical  /analyze-investment  /save-strategy  /risk-size  /execute-order  /daily-report</text>
  <text x="590" y="406" font-size="11.5" text-anchor="middle" fill="#3a0a5b">runs on Muneeb's machine · exposed via tunnel · every call authenticated + audit-logged</text>

  <!-- lines from agents to backend -->
  <line x1="130" y1="270" x2="420" y2="338" stroke="#7b2cbf" stroke-width="1.2" marker-end="url(#arrow-purple)"/>
  <line x1="360" y1="270" x2="470" y2="338" stroke="#7b2cbf" stroke-width="1.2" marker-end="url(#arrow-purple)"/>
  <line x1="590" y1="270" x2="560" y2="338" stroke="#7b2cbf" stroke-width="1.2" marker-end="url(#arrow-purple)"/>
  <line x1="825" y1="270" x2="700" y2="338" stroke="#7b2cbf" stroke-width="1.2" marker-end="url(#arrow-purple)"/>
  <line x1="1055" y1="270" x2="780" y2="338" stroke="#7b2cbf" stroke-width="1.2" marker-end="url(#arrow-purple)"/>

  <!-- Bottom row: MT5, Firestore, Cloud Scheduler -->
  <rect x="60" y="500" width="220" height="70" rx="10" fill="#e8f0fe" stroke="#1a56db" stroke-width="1.5"/>
  <text x="170" y="528" text-anchor="middle" font-weight="700" font-size="13" fill="#0b2e73">MT5 Terminal (demo acct)</text>
  <text x="170" y="546" text-anchor="middle" font-size="11.5" fill="#0b2e73">local, Windows-only —</text>
  <text x="170" y="561" text-anchor="middle" font-size="11.5" fill="#0b2e73">quotes, candles, orders</text>

  <rect x="480" y="500" width="220" height="70" rx="10" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.5"/>
  <text x="590" y="528" text-anchor="middle" font-weight="700" font-size="13" fill="#0b3d19">Firestore (GCP)</text>
  <text x="590" y="546" text-anchor="middle" font-size="11.5" fill="#0b3d19">strategies, risk state,</text>
  <text x="590" y="561" text-anchor="middle" font-size="11.5" fill="#0b3d19">watchlist, audit log, reports</text>

  <rect x="900" y="500" width="240" height="70" rx="10" fill="#fdeaea" stroke="#c62828" stroke-width="1.5"/>
  <text x="1020" y="528" text-anchor="middle" font-weight="700" font-size="13" fill="#5c0f0f">Cloud Scheduler (GCP)</text>
  <text x="1020" y="546" text-anchor="middle" font-size="11.5" fill="#5c0f0f">fires POST /daily-report</text>
  <text x="1020" y="561" text-anchor="middle" font-size="11.5" fill="#5c0f0f">every day at 8:00am</text>

  <line x1="400" y1="430" x2="185" y2="498" stroke="#444" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="560" y1="430" x2="580" y2="498" stroke="#444" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="780" y1="430" x2="1010" y2="498" stroke="#444" stroke-width="1.3" marker-end="url(#arrow-rev)"/>

  <!-- Roadmap -->
  <rect x="60" y="630" width="1080" height="90" rx="10" fill="#f5f5f5" stroke="#999" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="80" y="655" font-size="13" font-weight="700" fill="#333">Phase 2 (roadmap, not built for this submission):</text>
  <text x="80" y="676" font-size="12" fill="#333">Signal Ingestion Agent — listens to Discord/Telegram signal channels 24/7, extracts entry/SL/TP, converts to a</text>
  <text x="80" y="694" font-size="12" fill="#333">risk-sized order proposal via the SAME Risk &amp; Execution Agent above — i.e. still gated behind the daily cap</text>
  <text x="80" y="712" font-size="12" fill="#333">and human-approval settings, never a direct signal-to-order path.</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#666"/></marker>
    <marker id="arrow-rev" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#444"/></marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#c98a1a"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#7b2cbf"/></marker>
  </defs>
</svg>
